name: xnu-ipados26

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (26.1 = xnu-12377.41.6, iPadOS 26.1)
        default: "26.1"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      topaz_4k:
        description: Build 4 KiB page kernel (1 = 8-core AMP Gold+Silver, 0 = 16 KiB 4-core Gold)
        default: "0"
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      xcode_version:
        description: Optional Xcode version override (e.g. 26.1, 16.4, 16.3, 16.2; empty = deterministic auto-select)
        required: false
        default: ""
  push:
    branches: [ipados-26, main]
    paths:
      - "xnu/patches-ipados26/**"
      - "tests/run_unit_tests.py"
      - ".github/workflows/xnu-ipados26.yml"

concurrency:
  group: xnu26-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  MACOS_VERSION: ${{ inputs.macos_version || '26.1' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  TOPAZ_4K: ${{ inputs.topaz_4k || '0' }}
  XCODE_VERSION: ${{ inputs.xcode_version || '' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache-26
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Run automated unit tests
        run: python3 -B tests/run_unit_tests.py

      - name: Setup darwin-xnu-build for XNU 26.1 (SWEET / Sapphire)
        run: |
          git clone --depth 1 "$DXB_REPO" dxb
          rm -rf "dxb/patches/${MACOS_VERSION}"
          mkdir -p "dxb/patches/${MACOS_VERSION}"
          # Stage our unified XNU 26.1 patchset & dependency scripts
          cp xnu/patches-ipados26/*.sh xnu/patches-ipados26/*.patch "dxb/patches/${MACOS_VERSION}/"
          chmod +x "dxb/patches/${MACOS_VERSION}/"*.sh
          # Build libfirehose_kernel as plain ARMv8.0 arm64 (-mcpu=cortex-a53) for Sapphire SM6225
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          # Force Xcode 26.1+ xcodebuild to honor DEVELOPER_DIR inside all subshells
          sed -i '' 's|xcodebuild |DEVELOPER_DIR="${DEVELOPER_DIR}" xcodebuild |g' dxb/build.sh
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          ls -la "dxb/patches/${MACOS_VERSION}"

      - name: Install toolchain & dependencies
        run: |
          brew tap blacktop/tap || true
          brew trust blacktop/tap 2>/dev/null || true
          brew install jq gum bash cmake ninja ccache blacktop/tap/ipsw
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app || true
          XC=""
          if [ -n "${XCODE_VERSION:-}" ]; then
            for cand in \
              "/Applications/Xcode_${XCODE_VERSION}.app" \
              "/Applications/Xcode_${XCODE_VERSION}.0.app" \
              "/Applications/Xcode-${XCODE_VERSION}.app" \
              "/Applications/${XCODE_VERSION}"; do
              if [ -d "$cand" ]; then XC="$cand"; break; fi
            done
            if [ -z "$XC" ]; then
              echo "::error::Requested xcode_version='${XCODE_VERSION}' not found in /Applications" >&2
              exit 1
            fi
          else
            for cand in \
              "/Applications/Xcode_26.1.app" \
              "/Applications/Xcode_16.4.app" \
              "/Applications/Xcode_16.3.app" \
              "/Applications/Xcode_16.2.app"; do
              if [ -d "$cand" ]; then XC="$cand"; break; fi
            done
            if [ -z "$XC" ]; then
              XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
            fi
            if [ -z "$XC" ]; then
              XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
            fi
            if [ -z "$XC" ]; then
              XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            fi
          fi
          DEV_DIR="$XC/Contents/Developer"
          export DEVELOPER_DIR="$DEV_DIR"
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          sudo xcode-select -s "$DEV_DIR"
          xcodebuild -version
          xcrun clang --version
          mkdir -p "$CCACHE_WRAP"
          # Never cache .s assembly files (they include generated assym.s whose offsets change with TOPAZ_4K)
          for t in clang clang++; do
            printf '#!/bin/sh\nfor a; do case "$a" in *.s) exec %s "$@";; esac; done\nexec ccache %s "$@"\n' "$(xcrun -find $t)" "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache-26
          key: ccache26-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ env.TOPAZ_4K }}-${{ hashFiles('xnu/patches-ipados26/**', '.github/workflows/xnu-ipados26.yml') }}
          restore-keys: |
            ccache26-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build XNU 26.1 (xnu-12377.41.6)
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          set -o pipefail
          # Full log is ~1 GB of -Weverything warnings; keep it out of the console.
          TOPAZ_4K="${TOPAZ_4K}" bash build.sh > "$GITHUB_WORKSPACE/build-full.log" 2>&1
          rc=$?
          tail -n 40 "$GITHUB_WORKSPACE/build-full.log"
          ccache -s
          exit $rc
        shell: bash {0}

      - name: Collect kernel artifact
        if: always()
        run: |
          mkdir -p out-26
          if [ -f build-full.log ]; then
            grep -nE ' error: |Undefined symbols|^ld: |^  "_|\*\*\* \[|fatal error' build-full.log \
              | grep -v 'warning:' | head -n 400 > out-26/build-errors.txt || true
            tail -n 300 build-full.log > out-26/build-tail.txt
            echo "=== build errors ==="; head -n 120 out-26/build-errors.txt
          fi
          find dxb/fakeroot/System/Library/Kernels -maxdepth 1 -type f -name 'kernel.*' -exec cp -v {} out-26/ \; 2>/dev/null || true
          ls -lh out-26
          (cd out-26 && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipados26-xnu-kernel
          path: out-26/
          retention-days: 30
