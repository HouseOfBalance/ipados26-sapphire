# Codemagic CI for iPadOS 26.1 XNU Kernel (xnu-12377.41.6) on Xiaomi Redmi Note 13 4G (sapphire / SM6225Pro)
workflows:
  xnu-ipados26: &xnu26
    name: xnu-ipados26
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 16.2
      vars: &xnu26_vars
        DXB_REPO: https://github.com/blacktop/darwin-xnu-build
        MACOS_VERSION: "26.1"
        XCODE_VERSION: ""
        KERNEL_CONFIG: DEVELOPMENT
        MACHINE_CONFIG: SWEET
        MAKEFLAGS: -k
        CCACHE_COMPILERCHECK: content
        CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
        CCACHE_MAXSIZE: 3G
        ZIP_SUFFIX: "-ipados26"
    cache:
      cache_paths:
        - $CM_BUILD_DIR/.ccache-ipados26
    scripts:
      - name: Run automated unit tests
        script: |
          set -e
          python3 -B tests/run_unit_tests.py
      - name: Fetch darwin-xnu-build & stage iPadOS 26.1 patches
        script: |
          set -e
          git clone --depth 1 "$DXB_REPO" dxb
          rm -rf "dxb/patches/${MACOS_VERSION}"
          mkdir -p "dxb/patches/${MACOS_VERSION}"
          cp xnu/patches-ipados26/*.sh xnu/patches-ipados26/*.patch "dxb/patches/${MACOS_VERSION}/"
          chmod +x "dxb/patches/${MACOS_VERSION}/"*.sh
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
      - name: Select Xcode toolchain, install dependencies & ccache wrapper
        script: |
          set -e
          pip3 install --break-system-packages cmake ninja
          for t in gum xcodes; do
            command -v $t || { sudo mkdir -p /usr/local/bin; printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/$t >/dev/null; sudo chmod +x /usr/local/bin/$t; }
          done
          sw_vers
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XC=""
          if [ -n "${XCODE_VERSION:-}" ]; then
            for cand in \
              "/Applications/Xcode_${XCODE_VERSION}.app" \
              "/Applications/Xcode-${XCODE_VERSION}.app" \
              "/Applications/Xcode_${XCODE_VERSION}.0.app" \
              "/Applications/Xcode-${XCODE_VERSION}.0.app" \
              "/Applications/${XCODE_VERSION}"; do
              if [ -d "$cand" ]; then XC="$cand"; break; fi
            done
            if [ -z "$XC" ]; then
              echo "Requested XCODE_VERSION='${XCODE_VERSION}' not found in /Applications" >&2
              exit 1
            fi
          else
            for ver in 26.1 16.4 16.3 16.2; do
              for cand in "/Applications/Xcode_${ver}.app" "/Applications/Xcode-${ver}.app"; do
                if [ -d "$cand" ]; then XC="$cand"; break 2; fi
              done
            done
          fi
          if [ -n "$XC" ]; then
            DEV_DIR="$XC/Contents/Developer"
            sudo xcode-select -s "$DEV_DIR"
          else
            DEV_DIR="$(xcode-select -p)"
          fi
          export DEVELOPER_DIR="$DEV_DIR"
          if [ -n "${CM_ENV:-}" ]; then
            echo "DEVELOPER_DIR=$DEV_DIR" >> "$CM_ENV"
          fi
          xcodebuild -version
          xcrun clang --version
          wrap="$CM_BUILD_DIR/ccache-bin"
          mkdir -p "$wrap"
          cc=$(command -v ccache || true)
          for t in clang clang++; do
            printf '#!/bin/sh\nfor a; do case "$a" in *.s) exec %s "$@";; esac; done\nexec %s %s "$@"\n' "$(xcrun -find $t)" "$cc" "$(xcrun -find $t)" > "$wrap/$t"
            chmod +x "$wrap/$t"
          done
      - name: Build XNU 26.1 (xnu-12377.41.6)
        script: |
          set -e
          export CCACHE_DIR="$CM_BUILD_DIR/.ccache-ipados26" CCACHE_BASEDIR="$CM_BUILD_DIR" CCACHE_WRAP="$CM_BUILD_DIR/ccache-bin"
          cd dxb
          command -v ccache >/dev/null && ccache -z
          bash build.sh
          command -v ccache >/dev/null && ccache -s || true
      - name: Collect kernel artifact
        script: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          ls -la out
          (cd out && zip -qr ../xnu-kernel${ZIP_SUFFIX:-}.zip .)
    artifacts:
      - xnu-kernel*.zip

  xnu-ipados26-4k:
    <<: *xnu26
    name: xnu-ipados26-4k
    environment:
      xcode: 16.2
      vars:
        <<: *xnu26_vars
        TOPAZ_4K: "1"
        ZIP_SUFFIX: "-ipados26-4k"
